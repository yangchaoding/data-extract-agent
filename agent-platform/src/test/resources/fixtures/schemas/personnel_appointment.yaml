# 干部任免审批表：25 个本人字段 + 家庭成员及主要社会关系的 5 个子字段。
# 使用中文输出键；本人姓名与家庭成员姓名分别存放，避免重名覆盖。
name: personnel_appointment
description: >
  干部任免审批表。只抽取原文明确记载的内容，不补写、不推算。
  表头中的间隔点、空格和换行只用于排版，定位字段时可忽略。
  空白栏和未提供的页面内容返回 null；原文明写“无”时保留字符串“无”。
  年月按原文保存，不补日期、不计算年龄。
  合并单元格在片段中可能重复显示，同一内容只取一次。
  同一字段跨行时按阅读顺序保留各段原文，用换行分隔，尤其不要遗漏院校专业和简历的续行。
  不要根据入党时间推断政治面貌，不要根据现任职务推断拟任职务、拟免职务或专业技术职务。
fields:
  - name: 姓名
    required: true
    description: 表格上部任免对象本人的姓名，不是家庭成员姓名。

  - name: 性别
    description: 任免对象本人的性别，照抄原文。

  - name: 出生年月（岁）
    type: string
    hints: [出生年月, 出生年月（岁）, 年龄]
    description: 原样保留出生年月及同一栏明确写出的年龄；只有年月时只写年月，不推算年龄。

  - name: 民族
    description: 任免对象本人的民族，照抄原文。

  - name: 籍贯
    description: 籍贯栏的原文，与出生地分开读取。

  - name: 出生地
    description: 出生地栏的原文，不从籍贯补写。

  - name: 入党时间
    type: string
    description: 原样保留入党年月，不补具体日期。

  - name: 参加工作时间
    type: string
    description: 参加工作时间栏的年月，原样保留，不从简历推算。

  - name: 健康状况
    description: 健康状况栏明确填写的文字。

  - name: 全日制教育
    hints: [学历学位, 全日制, 教育]
    description: 学历学位区的全日制教育学历或学位，完整保留原文，不与在职教育混淆。

  - name: 全日制教育毕业院校系及专业
    hints: [全日制, 毕业院校, 系及专业]
    description: >
      全日制教育对应的毕业院校、院系及专业的完整原文。
      合并“毕业院校”和下一行“系及专业”对应的内容，原文跨行处保留换行。
      同一文字因合并单元格重复时只取一次，不擅自补写学校、院系或专业。

  - name: 在职教育
    hints: [学历学位, 在职, 教育]
    description: 学历学位区的在职教育学历或学位；明确写“无”则保留“无”，空白返回 null。

  - name: 在职教育毕业院校系及专业
    hints: [在职, 毕业院校, 系及专业]
    description: 在职教育对应的毕业院校、院系及专业，跨行保留换行；空白返回 null，不复用全日制内容。

  - name: 现任职务
    hints: [现任职务]
    description: 现任职务栏的完整单位和职务名称，保持原文。

  - name: 拟任职务
    hints: [拟任职务]
    description: 只取拟任职务栏；空白返回 null，不从现任职务或简历补写。

  - name: 拟免职务
    hints: [拟免职务]
    description: 只取拟免职务栏；空白返回 null，不从现任职务或简历补写。

  - name: 简历
    description: >
      简历栏的全部经历，完整保留每段起止时间、单位和职务，按原文顺序逐段换行。
      不概括、不省略任何经历；evidence 应覆盖全部经历，可以分多段逐字摘抄。

  - name: 奖惩情况
    hints: [奖惩情况, 奖励, 惩处]
    description: 奖惩情况栏的全部原文；明确写“无”则保留，未提供则返回 null。

  - name: 年度考核结果
    hints: [年度考核结果, 年度考核]
    description: 年度考核结果栏的全部年份和对应结果，逐段保留，未提供则返回 null。

  - name: 任免理由
    description: 任免理由栏的全部原文，未提供则返回 null，不自行解释任免原因。

  - name: 呈报单位
    description: 呈报单位栏明确填写的单位名称，不从现任职务推断。

  - name: 审批机关意见
    description: 审批机关意见栏的全部可识别文字，包括明确属于该栏的日期，未提供则返回 null。

  - name: 专业技术职务
    hints: [专业技术职务, 技术职称]
    description: 只取专业技术职务栏的文字，空白返回 null，不拿行政职务或学历替代。

  - name: 行政任免机关意见
    description: 行政任免机关意见栏的全部可识别文字，包括明确属于该栏的日期，未提供则返回 null。

  - name: 熟悉专业有何专长
    hints: [熟悉专业, 有何专长]
    description: 只取熟悉专业有何专长栏的文字，空白返回 null，不从毕业专业或简历推断。

  - name: 家庭成员及主要社会关系
    type: list
    exhaustive: true
    hints: [家庭成员, 主要社会关系, 称谓, 政治面貌, 工作单位及职务]
    description: >
      家庭成员及主要社会关系表中的全部有效人员行，每个人一项。
      不包含任免对象本人，不从其他字段猜测亲属，不输出空白行。
      没有这一部分时返回 []；每行未填写的子字段返回 null。
    fields:
      - name: 称谓
        description: 该成员的称谓或与任免对象的关系，照抄原文。
      - name: 姓名
        description: 当前家庭成员或社会关系人员的姓名。
      - name: 年龄
        type: string
        description: 该成员年龄栏的原文，不通过出生日期计算。
      - name: 政治面貌
        description: 该成员政治面貌栏的原文，不根据其他内容推断。
      - name: 工作单位及职务
        description: 该成员工作单位及职务的完整原文，不截断单位或职务名称。
